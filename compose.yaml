services:
  tracelens:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TRACELENS_DATA_DIR: /app/data
    volumes:
      - tracelens-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  tracelens-data:
